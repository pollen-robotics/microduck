# Creates the `mapd` system user and group.
#
# Install to /usr/lib/sysusers.d/mapd.conf; systemd-sysusers creates them at boot, or run
# `systemd-sysusers` once by hand.
#
# `mapd` needs nothing privileged: it reads two sockets as a member of `robot` (granted in
# mapd.service) and writes its own state directory. mapd.service will fail to start if this user
# does not exist.
u mapd - "Robot onboard map" - -
