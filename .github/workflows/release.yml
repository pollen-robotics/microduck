# Cutting a release. **The GitHub UI is the entry point.**
#
# Create a release in the web interface and this decides what that means, from the tag and from what
# already exists:
#
#   pre-release, tag `daemon-staging-v1.2.3`  →  build it, sign it, verify it, publish to STAGING
#   release,     tag `daemon-v1.2.3`          →  promote staging 1.2.3 if it exists — the same bytes,
#                                                re-signed — otherwise build 1.2.3 directly
#
# Pushing either tag from a terminal does the same thing; the release object is created for you.
#
# The two shapes of stable release are not equivalent, and the one you get is recorded in the release
# notes rather than left to be inferred. Promoted means a canary ran exactly these bytes. Built
# directly means the artifact was verified through the real update engine here — signature, manifest,
# a genuine install — but no robot has run it. Both are signed with the key customer robots trust, so
# the difference is validation, not authenticity.
#
# Promotion never rebuilds, which is the property updater-design.md §16.3 exists to protect: what
# reaches client robots is byte-identical to what was validated.
name: release

# One trigger, deliberately.
#
# Publishing a release in the UI creates the tag, so this fires for the UI path as well as for
# `git push --tags` — verified both ways. There *was* also a `release: published` trigger, and it made
# every UI release start two identical runs; the concurrency group below cancelled one, and a
# cancelled run counts as a failed check, so a perfectly good release showed a red ✗ on its tag.
#
# What one trigger gives up: publishing a release against a tag that *already exists* does nothing.
# That tag's push already built it, so there is nothing to do — and if a build genuinely needs
# repeating, re-run it from the Actions tab.
on:
  push:
    tags:
      - 'daemon-staging-v*'
      - 'daemon-v*'

permissions:
  contents: write

# One run per tag, still — a belt to the single trigger's braces. Two runs publishing the same tag
# would race on the upload, and because each build stamps its own `DUCK_BUILD_TIME` the artifacts are
# not byte-identical: the release could end up with a manifest from one run and a tarball from
# another, which is a sha256 mismatch no robot can install and nothing in the release explains.
#
# `cancel-in-progress: false`, because a cancelled run reports as a failed check and there is nothing
# to cancel for anyway: whoever pushed the same tag twice wants the second attempt to wait, not to
# make the first look broken.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Which channel, which version, and whether there is anything to promote.
  #
  # Its own job because the two workflows it chooses between are `uses:` jobs, and those can only be
  # conditioned on something computed outside themselves.
  decide:
    runs-on: ubuntu-latest
    # Everything under `daemon-` reaches this job, and the well-formedness check happens *inside* it
    # rather than here. That is deliberate, and it is the fix for a real waste of time: a release
    # published as `daemon-staging-0.4.0` — no `v` — skipped every job, and an all-grey run reads as
    # "nothing has happened yet" rather than "your tag is wrong".
    #
    # What still has to skip silently is `daemon-dev-*`: `dev.yml` publishes one on every push to
    # every branch, and those are not release attempts. Anything else beginning with `daemon-` is
    # someone trying to cut a release, and deserves a red X with the answer in it.
    if: >-
      startsWith(github.ref_name, 'daemon-') &&
      !startsWith(github.ref_name, 'daemon-dev-')
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in
              daemon-staging-v*)
                  version="${TAG#daemon-staging-v}"
                  mode=staging
                  ;;
              daemon-v*)
                  version="${TAG#daemon-v}"
                  # Promote when there is something to promote. `gh release view`, not a tag lookup:
                  # a tag with no release behind it carries no artifact, so there would be nothing
                  # to copy.
                  if gh release view "daemon-staging-v${version}" >/dev/null 2>&1; then
                      mode=promote
                  else
                      mode=stable
                  fi
                  ;;
              *)
                  echo "::error::$TAG is not a release tag. Use daemon-staging-vX.Y.Z for a candidate, published as a pre-release, or daemon-vX.Y.Z for a release. The v is not optional."
                  exit 1
                  ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

          # Said out loud, in the run summary, because "which of the three things happened" is the
          # first question anyone asks when a release looks wrong.
          case "$mode" in
              staging) what="build → STAGING (a prerelease; promote it once a canary has run it)" ;;
              promote) what="promote daemon-staging-v${version} → STABLE (same bytes, re-signed)" ;;
              stable)  what="build → STABLE directly (no staging release exists; NOT canaried)" ;;
          esac
          echo "$TAG: $what" | tee -a "$GITHUB_STEP_SUMMARY"

  staging:
    needs: decide
    if: needs.decide.outputs.mode == 'staging'
    uses: ./.github/workflows/_build-release.yml
    with:
      tag: ${{ needs.decide.outputs.tag }}
      version: ${{ needs.decide.outputs.version }}
      prerelease: true
    secrets: inherit

  promote:
    needs: decide
    if: needs.decide.outputs.mode == 'promote'
    uses: ./.github/workflows/_promote-release.yml
    with:
      version: ${{ needs.decide.outputs.version }}
    secrets: inherit

  # The uncanaried path. Deliberately reachable — a version with no staging release is usually
  # someone who knows exactly what they are shipping — and deliberately labelled, in the notes the
  # release itself carries.
  stable:
    needs: decide
    if: needs.decide.outputs.mode == 'stable'
    uses: ./.github/workflows/_build-release.yml
    with:
      tag: ${{ needs.decide.outputs.tag }}
      version: ${{ needs.decide.outputs.version }}
      prerelease: false
    secrets: inherit
