# `microduck` on PyPI, so `pip install microduck` gets the Python SDK on any machine.
#
# On a tag `sdk-vX.Y.Z` only. The SDK's version is its own, in `sdk/pyproject.toml`, not the
# workspace version, so it has its own tag rather than riding `daemon-v*` as `duckctl` does: a fix
# to the SDK does not wait for a robot release, and a robot release does not publish an SDK that
# did not change.
#
# An sdist and a wheel. The SDK is pure Python, so the sdist builds anywhere and nothing compiles
# on the user's machine either way.
#
# Trusted publishing, as for `duckctl`: no API token in the repo secrets. It needs a publisher on
# PyPI naming this repository, this file and the `pypi` environment. `docs/project/ci-setup.md` has
# the one-time setup.
#
# `workflow_dispatch` is for a run to repeat: start it from the tag (Use workflow from → Tags →
# `sdk-vX.Y.Z`).
name: microduck to PyPI

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-pypi-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # A tag that disagrees with `sdk/pyproject.toml` would publish a version nobody released, and a
  # PyPI version can never be taken back. Refused here, before anything is built.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the SDK's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in
              sdk-v*) ;;
              *) echo "::error::run this from an sdk-vX.Y.Z tag, not '$TAG'"; exit 1 ;;
          esac
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("sdk/pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${TAG#sdk-v}" != "$version" ]; then
              echo "::error::$TAG but sdk/pyproject.toml says $version"
              exit 1
          fi
          echo "publishing microduck $version" | tee -a "$GITHUB_STEP_SUMMARY"

  # Built in its own job, so the job that can publish runs nothing but the upload.
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build sdk --outdir dist
      - run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: microduck-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/microduck
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: microduck-dist
          path: dist
      # `skip-existing`, so re-running a release whose upload half-failed finishes it rather than
      # failing on the files PyPI already has (it never accepts the same file twice).
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
