# The head ToF sensor: an 8x8 depth matrix from a VL53L8CX, and the daemon that
# serves it.
#
# The driver is ST's Ultra Lite Driver (vendored C, BSD-3-Clause) behind a flat
# shim and a safe Rust wrapper — see src/lib.rs for why the C is vendored rather
# than reimplemented or depended on. `tofd` owns the sensor and publishes frames;
# nothing else touches the bus.
[package]
name = "tof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "tof"

[[bin]]
name = "tofd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { workspace = true, features = ["derive"] }
duck-ipc-proto = { path = "../duck-ipc-proto" }
# `[head_imu]` lives in `robotd.toml`, and this crate is the schema for that file — the same
# dependency, for the same reason, that `mediad` takes on for `[media]`. See `src/config.rs`.
robotd-params = { path = "../robotd-params" }
libc = "0.2"
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time", "io-util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# The head IMU (`src/imu.rs`) reaches the BMI088 through `/dev/i2c-*`, which exists on no other
# platform — the same rule `build.rs` already applies to the vendored ULDs, and for the same reason:
# `cargo test --workspace` has to run on a developer's Mac. Off Linux `tofd` still builds, still
# serves depth from `--fake` or `--sim`, and answers `head_imu.stream` with why it has no sensor.
[target.'cfg(target_os = "linux")'.dependencies]
# The BMI088 driver and its Madgwick fusion, ours because the crates.io ones stop at the raw
# registers. Pinned to a tag: it is a second repository and a moving `main` is not a dependency.
# v0.1.2 is the one that has `Bmi088Ahrs::update_all`, which is what takes a head-IMU sample
# from three I²C transactions to two.
bmi088 = { git = "https://github.com/pollen-robotics/bmi088-rs", tag = "v0.1.2" }
# `I2cdev`, the `embedded-hal` bus the driver is generic over. Linux-only by construction —
# `i2cdev`'s `linux` module is the whole crate.
linux-embedded-hal = "0.4"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3.27.0"
