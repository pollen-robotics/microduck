# /etc/robot/updater.toml — the config a client robot ships with.
#
# Installed by `scripts/install.sh`. This is the *production* file; keep
# `updater/updater.example.toml` as the annotated reference — it documents every option,
# including the ones deliberately not set here.
#
# The difference from the example is the point: the example shows what is possible, this
# shows what is true of a shipped robot. Every value below is either a decision or a
# fact, and where the two files disagree the example's comments explain the option while
# this file's comment explains the choice.

# The trust anchor. All three release public keys go in here at install time, even
# though only `release-1` signs today: a robot can verify only against the set baked
# into it, so shipping the spares is the one chance to make key rotation possible
# without physically re-flashing (docs/ci-setup.md).
trusted_keys_dir = "/etc/robot/trusted_keys"

hw_rev = 1

# Outside every `install_dir`, so the record of what happened survives the swap or
# rollback it is recording (§5.7).
state_dir = "/var/lib/robot/updater"

robot_socket = "/run/robotd.sock"

# Both false, and this is the file that makes them false on a client robot. `allow_dev_keys`
# would let anything a teammate builds install itself; `allow_fault_injection` would let the
# updater be told to fail on purpose. Developer boards override these locally — they are not
# overridden by an update, because updates do not touch /etc.
allow_dev_keys        = false
allow_fault_injection = false

# What makes `min_supported` mean anything. Without a poll a robot only learns a floor
# exists when someone opens the app, so "we shipped a bad release" would be unfixable on
# any robot whose owner is away (§8.1).
check_interval = "6h"

# What the periodic check may install with no client attached: "off", "mandatory", "all".
#
# `mandatory` — a release whose manifest carries `min_supported` above the running version
# — because the alternative is a fleet stuck on a release we have already withdrawn.
# Ordinary releases still wait for a client: when a robot restarts is its owner's
# decision, and the app-driven update flow exists to give them that decision.
#
# `all` is for canary and bench robots (§16.2 Tier 2): they track a channel and install
# every candidate. Setting it here would opt every client robot into unattended restarts.
#
# Whichever is set, an unattended apply is an ordinary apply — same preflight, so a robot
# that is walking or streaming refuses and retries at the next interval; same health gate,
# so a release that does not come up is rolled back.
auto_apply = "mandatory"

# `allow_uids` / `allow_gids` are deliberately absent, which means only root may apply,
# roll back, select or pin. Support and scripts run `robotctl` under sudo.
#
# Membership of the `robot` group gets a process as far as *talking* to updaterd (the
# socket is 0660) and no further — status and logs, not changes. Listing the group here
# would collapse those two layers into one. `btd`'s own uid belongs here once it exists,
# because "may relay an update request from the app" is a narrower claim than "is in the
# robot group".


# ── daemon ────────────────────────────────────────────────────────────────────
[component.daemon]
install_dir   = "/opt/robot/daemon"
keep_previous = 1

# `golden` is deliberately unset until 1.0.0 exists.
#
# It names a never-pruned known-good release, and `robotctl update reset-to-golden` is
# the last link in the never-brick chain (§8.2). Naming a version the robot has never
# installed would make that command fail at exactly the moment it is needed, which is
# worse than it reporting honestly that no golden is configured. Set it in the same
# change that ships 1.0.0.
# golden = "1.0.0"

# The stable channel. `daemon-v*` tags only: staging publishes `daemon-staging-v*` and
# marks it prerelease, so it is excluded twice over and a client robot cannot drift onto
# a candidate build.
[component.daemon.source]
type           = "github_releases"
repo           = "ORG/duck-daemon"
tag_prefix     = "daemon-v"
manifest_asset = "manifest.json"
# Tag prefix for per-branch dev builds, so `--ref my-branch` resolves to
# `daemon-dev-my-branch`. Shown for completeness — this is the default.
#
# Separate from tag_prefix because the two streams must never be confusable: a dev tag
# *moves* (it points at whatever that branch last built) while a release tag is immutable,
# and `latest` for the fleet must never consider a dev tag. Installing one also requires
# allow_dev_keys and the dev public key, so a client robot cannot take a branch build even
# if it somehow resolved the tag.
# ref_tag_prefix = "daemon-dev-"

# `updaterd` restarts neither itself nor `btd`, both of which ship in this same artifact:
# restarting itself would kill the executor mid-update, and restarting `btd` would drop
# the connection reporting progress to the app. Both pick up the new binary at the next
# boot. `mediad` joins this list in the change that first installs it — naming a unit
# that does not exist makes `systemctl restart` fail, which rolls the update back.
[component.daemon.on_apply]
action = "restart"
units  = ["robotd"]

# The gate that makes auto-rollback real. 30s is still the placeholder M4 is meant to
# replace with a measured boot time plus margin; too short reverts a healthy release that
# merely starts slowly.
#
# The gate rolls back on *unhealthy*, not on *degraded*. A robot that cannot see its servos
# reports degraded, and passes: it said the same thing before the swap, so reverting cannot
# fix it and would revert every release ever shipped to a bench board. A release that broke
# the control loop still reverts. `robotctl health` prints which one it is.
[component.daemon.health]
probe   = "socket"
timeout = "30s"


# ── models ────────────────────────────────────────────────────────────────────
# Absent on purpose, and this is not an oversight to be fixed by copying the example.
#
# `updater.example.toml` configures `model-walk` and `model-jump` against HF repos that
# do not exist yet. A component whose source 404s makes every `check` — including the
# periodic one above — report a failure for a component nobody has shipped, which trains
# whoever reads robot status to ignore failures. Each model component lands in the change
# that first publishes its bundle.
