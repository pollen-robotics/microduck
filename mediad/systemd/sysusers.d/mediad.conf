# Creates the `mediad` system user and group.
#
# Install to /usr/lib/sysusers.d/mediad.conf; systemd-sysusers creates them at boot, or run
# `systemd-sysusers` once by hand.
#
# `mediad` runs as its own unprivileged user, and here that is not only hygiene: it is the case the
# whole permission story was worked out for. A `mediad` running as root would open
# /dev/mpp_service and /dev/rga regardless of their group, so every problem the udev rule in
# `scripts/setup-gstreamer.sh` exists to prevent would be invisible until something else ran as a
# user — which is exactly how those three failures were found in the first place.
#
# What this user gets comes entirely from group membership, granted in mediad.service:
#
#   video  — the VPU (/dev/mpp_service), the 2D accelerator (/dev/rga) and the capture nodes
#   robot  — the 0660 sockets of robotd, configd, updaterd, and the taps padd and tofd hand to
#            that group themselves
#   robot-account — the account credential updaterd writes, which the relay signs in with. Its
#            own group and not `robot`, because `robot` is everybody; see robot.conf.
#
# mediad.service will fail to start if this user does not exist.
u mediad - "Robot media and WebRTC gateway" - -
m mediad robot-account
