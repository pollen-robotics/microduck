[package]
name = "mediad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Camera, mic, WebRTC — and the remote gateway"

# GStreamer is assumed on Linux, the way `padd`'s evdev tap is. The daemon runs on the robot; the
# route table, the session pipe, the upstream pool and the relay are portable and their tests run on
# a laptop. Gating by target rather than by feature keeps `cargo test` honest — a feature that is
# off by default is a module nobody compiles.
#
# **And off Linux the same pipeline is one `brew install gstreamer` away, behind `--features
# gstreamer`.** GStreamer is not the Linux part; the *capture* half is — `v4l2src`, the driver's
# buffer pool, the sensor mode — and that is about 230 lines of `pipeline.rs`. The rest is an
# appsrc, a tee, an appsink and `webrtcsink`, which run wherever they are installed. Since
# `Source::Sim` exists there is something real to point them at: a duck in MuJoCo on a developer's
# machine is otherwise a robot with no video, no console and nothing in its owner's robot list.
#
# Off by default there, deliberately. Homebrew's `gstreamer` is one merged formula that pulls gtk4
# and ffmpeg with it, and somebody working on `robotd` should not install it to run `cargo check`.
# The cost is the one the note above warns about: no CI job compiles this combination, so it is a
# developer running it that keeps it working.
#
# This is the second C dependency to reach the board, after libudev for `gilrs` in `padd`, and it is
# much larger: `scripts/cross-sysroot.sh` exists for it. `ci-cross-deps.sh` says of the first that
# it "is the cost of that one exception, and it is worth reading before adding another" — this is
# that other, and the cost is a sysroot the whole workspace now builds against.

[dependencies]
# One function: `read_access_token`. The crate that performs the login is the one that defines the
# credential's file format, so the reader lives next to the writer and a test there pins the key
# this depends on — rather than a two-field struct here and a test in `updater` describing it.
hf-robot-account = "0.1"
duck-ipc-proto = { path = "../duck-ipc-proto" }
# `[media]` and `[duck_detector]` in /etc/robot/robotd.toml — what this daemon streams, and what it looks
# for. The same crate `robotd` parses that file with and the same one `robotctl configure` edits it
# through, so the schema, the defaults and the editor cannot drift from what is read here.
robotd-params = { path = "../robotd-params" }
anyhow = "1"
# `getgrnam` and `chown`, to hand the frame socket to the `robot` group after binding — the same
# thing `tof` and `padd` do with theirs. Mode 0660 alone would leave it `mediad:mediad`, and the
# operator is only ever added to `robot`.
libc = "0.2"
# The detector itself: the letterbox+turn, the NPU binding, the ONNX fallback and the decoder.
duck-detect = { path = "../duck-detect" }
# The sampler both the detector and the snapshot routes take a frame through.
uyvy = { path = "../uyvy" }
# JPEG for the frame stream and PNG for lossless console snapshots.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# The console's one route. Already in `Cargo.lock` — `updater` uses it for its test mirror — so it
# is known-good against this toolchain and the cross build. The alternative was a hand-rolled
# HTTP/1.1 responder: about sixty lines of hand-written request parsing bound to 0.0.0.0, written to
# avoid a dependency the build already resolves, where `hyper` underneath this is the most-read
# implementation of that parser in the language. `webrtc-console.md` §1.1.
#
# Default features off: this serves one file over GET, and JSON extractors, multipart, forms and
# tracing middleware are all weight for routes that do not exist.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
clap = { workspace = true, features = ["derive"] }
# The relay's half of the bridge: HTTPS to the rendezvous service — SSE inbound, `POST /send`
# outbound. Same line `updater` uses, minus `form` (nothing here posts a form), so the TLS stack
# and its version are the ones already resolved for this workspace and its cross build.
# `stream` is what makes the SSE body readable as it arrives rather than at the end.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "http2", "charset"] }
# Server-Sent Events framing — `event:`/`data:` lines, multi-line data, comments and the
# reconnection field. Sixty lines to hand-roll and one of them would be the bug: a `data:` split
# across two TCP reads.
eventsource-stream = "0.2.3"
# Parsing, not fetching: the one endpoint this daemon sends the account token to is
# checked before the token can reach it, and "is this loopback" and "does this carry
# userinfo" are the two questions a hand-rolled split on `:` gets wrong. Already in the
# lock via `reqwest`.
url.workspace = true
# `StreamExt`, for the byte stream `reqwest` hands over. Already in the lock via `updater`.
futures-util = "0.3.33"
# The local half of the bridge: a WebSocket client to `webrtcsink`'s own signalling server on
# 127.0.0.1:8443, where this daemon is a *consumer* — the same role the console page plays on a
# LAN. `ws://` only, on loopback, so no TLS: `connect` and `handshake` and nothing else.
# `rustls-tls-webpki-roots` because the frame stream dials a `wss://` Space, where the
# signalling bridge only ever dialled `ws://127.0.0.1`. The roots are webpki's rather
# than the platform's: a board's trust store is whatever the image shipped, and a
# consumer that stops working after an OS update is a worse failure than a pinned set.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# Jitter on the reconnect backoff, so a fleet coming back after a service restart does not arrive
# in lockstep. Already in the lock.
rand = "0.10.2"
# The relay's message types. `serde_json` was enough while every JSON object here was forwarded
# verbatim; the rendezvous protocol is the first one this daemon has to *write*.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# The pipeline, and the only part of this crate that is not portable.
#
# `gstreamer-webrtc` is here for the data channel: a `GstWebRTCDataChannel` is what
# `create-data-channel` returns, and reaching for untyped `glib::Object` calls to avoid one
# dependency would be a poor trade.
[target.'cfg(target_os = "linux")'.dependencies]
# `v1_22` on both, which is not a guess: it is the floor `gst-plugins-rs`'s own webrtc crate
# declares, and it is what gates `WebRTCDataChannel` into existence (that type needs `v1_18`).
# The board runs 1.26.2, so this is comfortably satisfied — and pinning the floor at what the
# plugin requires rather than at what the board happens to have means a build failure here would
# name a real incompatibility rather than an accident of one robot's package versions.
gstreamer = { version = "0.24", features = ["v1_22"] }
# `appsink`, for the raw NV12 branch off the tee — perception and `get_frame` both want pixels,
# and taking them off the encoded branch would mean decoding what was just encoded.
gstreamer-app = { version = "0.24", features = ["v1_22"] }
gstreamer-webrtc = { version = "0.24", features = ["v1_22"] }
# `GstVideoMeta`, which the camera source has to advertise in the ALLOCATION query or v4l2src
# copies every frame — see `advertise_video_meta`. Typed, so the meta API type comes from the
# bindings rather than a hand-written GType lookup.
gstreamer-video = { version = "0.24", features = ["v1_22"] }
glib = "0.21"

# The pipeline on a machine that is not the robot. See the note at the top of this file.
#
# Named for what it needs rather than for what it is for: the answer to "why will this not build" is
# `brew install gstreamer`, which a feature called `sim-media` would not say.
[features]
gstreamer = [
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:gstreamer-video",
    "dep:gstreamer-webrtc",
    "dep:glib",
]

# The same four crates, optional, everywhere that is not the robot's OS. A second target table
# rather than making the Linux ones optional, so Linux is exactly as it was: no feature to remember,
# and no way to build a `mediad` for a board that cannot stream.
[target.'cfg(not(target_os = "linux"))'.dependencies]
gstreamer = { version = "0.24", features = ["v1_22"], optional = true }
gstreamer-app = { version = "0.24", features = ["v1_22"], optional = true }
gstreamer-webrtc = { version = "0.24", features = ["v1_22"], optional = true }
gstreamer-video = { version = "0.24", features = ["v1_22"], optional = true }
glib = { version = "0.21", optional = true }

[dev-dependencies]
# `[media]` from a real file on disk, which is how `config::load`'s fall-back-to-defaults rule is
# tested without a board.
# `every_call()`, so this crate's exhaustive-match tests use the same list every other
# transport's do rather than growing a third copy of it.
duck-ipc-proto = { path = "../duck-ipc-proto", features = ["test-support"] }
# Fake daemons on real unix sockets, which is how the pipe is tested without a WebRTC peer.
tempfile = "3"
# The fake rendezvous service the relay is tested against: `axum` needs a `Stream` to serve SSE
# from, and one `async_stream::stream!` is what a hand-written `Stream` impl would be.
async-stream = "0.3.6"
# `ws` for the fake signalling server the bridge is tested against — the local side of a session
# is a WebSocket, and a test that faked it with a channel would not exercise the framing.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "ws"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
