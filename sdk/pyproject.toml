[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microduck"
version = "0.1.0"
description = "Drive a Microduck from a script, over the agent WebSocket"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["websockets>=13"]

[tool.setuptools.packages.find]
include = ["duck*"]
