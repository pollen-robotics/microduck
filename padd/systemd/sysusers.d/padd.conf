# Creates the `padd` system user and group.
#
# Install to /usr/lib/sysusers.d/padd.conf; systemd-sysusers creates them at boot, or run
# `systemd-sysusers` once by hand.
#
# `padd` runs as its own unprivileged user for the reason the crate exists: it is an ordinary
# intent client with no privileged access to the robot, and it exercises the same API the phone app
# and the SDK will use. A `padd` running as root would still work and would quietly make that claim
# untrue.
#
# What this user gets comes entirely from group membership, granted in padd.service:
#
#   input  — reads the pad through /dev/input/event*, which is root:input mode 0660
#   robot  — reaches robotd's 0660 socket, like every other client
#
# This is also what replaced adding the *operator* to the `input` group. That worked, needed a log
# out and back in before it took effect, and was invisible when forgotten: `padd` started, reported
# nothing, and saw no pad at all. A system user with the group in its unit has neither problem.
#
# padd.service will fail to start if this user does not exist.
u padd - "Robot gamepad intent client" - -
