# The NFC reader, and the daemon that pairs a gamepad from a tag.
#
# A pairing tag — every one reads `microduck_gamepad_pairing` — touched to the reader pairs the pad
# in pairing mode: the same `pad.pair` `robotctl pad pair` sends, without anyone typing. `nfcd` owns the
# reader and is a client of `configd` and `robotd` for everything else, so it holds no Bluetooth
# access of its own.
#
# The reader is a CLRC663 on USB serial. Its driver is a port of `ntag663` (the winnie repo), in
# Rust rather than called from Python so it ships in the release like every other daemon — and with
# no serial crate, because termios is a dozen lines of `libc` and every serial crate that does
# hot-plug brings libudev, the C dependency `padd` already pays for.
[package]
name = "nfc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "nfc"

[[bin]]
name = "nfcd"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
duck-ipc-proto = { path = "../duck-ipc-proto" }
# Only for which board this is, so the reader is found without configuration.
robotd-params = { path = "../robotd-params" }
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
