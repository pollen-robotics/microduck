# Creates the `autod` system user and group.
#
# Install to /usr/lib/sysusers.d/autod.conf; systemd-sysusers creates them at boot, or run
# `systemd-sysusers` once by hand.
#
# `autod` is an ordinary intent client, like padd: what it may do comes entirely from the `robot`
# group granted in autod.service, which reaches robotd's and tofd's sockets and nothing else.
#
# autod.service will fail to start if this user does not exist.
u autod - "Robot autonomous brain" - -
