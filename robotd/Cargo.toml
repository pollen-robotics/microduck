[package]
name = "robotd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Robot control daemon — skeleton"

[dependencies]
duck-ipc-proto = { path = "../duck-ipc-proto" }
duck-control = { path = "../duck-control" }
clap = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "signal",
    "sync",
] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
libc = "0.2"
thiserror.workspace = true
toml = "0.9"

# Test-only. `tests/updater_gate.rs` drives the real update engine against this binary,
# which is why `updater` appears here: the test asserts that robotd upholds the contract
# the engine depends on. A dev-dependency, so none of it reaches the shipped binary, and
# the direction is one-way — `updater` does not depend on `robotd`.
#
# The test lives in *this* package rather than in `updater/tests/` for one concrete
# reason: only here does cargo define `CARGO_BIN_EXE_robotd` and guarantee the binary is
# built and up to date. In `updater/tests/` the path had to be guessed from the test
# binary's location, and `cargo test --test <name>` does not rebuild sibling binaries —
# so the test silently ran a stale robotd. That produced a confidently wrong result once
# already.
[dev-dependencies]
updater = { path = "../updater" }
test-support = { path = "../test-support" }
minisign = "0.9.1"
semver.workspace = true
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
zstd = "0.13"
