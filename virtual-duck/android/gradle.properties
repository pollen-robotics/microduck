# Small on purpose: this builds on machines that are busy with other work, and nothing here needs
# more. One modest daemon, two workers, the Kotlin compiler inside it rather than a second JVM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon.idletimeout=300000
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
